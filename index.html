const con=(t,l,k="")=>'<div class="con '+k+'"><div class="t">● ● ● &nbsp;'+t+' (console simulée)</div><pre>'+l.map(x=>Array.isArray(x)?'<span class="p">'+x[0]+'</span><span class="c">'+x[1]+'</span>':x[0]=="+"?'<span class="ok">'+x.slice(1)+'</span>':x[0]=="!"?'<span class="er">'+x.slice(1)+'</span>':x).join("\n")+'</pre></div>';
const nt=(t,b,w)=>'<div class="n'+(w?' w':'')+'"><b>'+t+'</b>'+b+'</div>';
const tb=(h,r)=>'<table><tr>'+h.map(x=>'<th>'+x+'</th>').join("")+'</tr>'+r.map(a=>'<tr>'+a.map(x=>'<td>'+x+'</td>').join("")+'</tr>').join("")+'</table>';
const S1="S1# ",R1="R1# ";
const SEC=[
{g:"Introduction",id:"home",t:"Fiche du cours",h:`<h2>Contrôle d’accès, MFA et sécurisation des accès distants</h2><p>Séances 4 et 5 — 4 h de cours + TP guidé SecureCorp.<br>Auteur : <b>Innocent Twagirumukiza</b> · <a href="https://www.linkedin.com/in/innocent-twagirumukiza" target="_blank" rel="noopener">LinkedIn</a> · <a href="https://twagirumukiza.github.io/Twagirumukiza-Innocent/" target="_blank" rel="noopener">Site web</a></p>`+tb(["Rubrique","Détail"],[["Public","Étudiants en informatique / cybersécurité"],["Durée","2 × 2 h de cours + TP ≈ 1 h 45"],["Outils","Cisco Packet Tracer, application TOTP, compte de test autorisé"],["Contenu","Contrôle d’accès, certificats, moindre privilège, segmentation, MFA, DSP2/SCA, VPN, ZTNA, Zero Trust, logs"]])+`<h3>Compétences visées</h3><ul><li>Distinguer authentification et autorisation</li><li>Proposer une MFA adaptée au risque</li><li>Établir une matrice de droits (moindre privilège)</li><li>Décrire et vérifier une segmentation VLAN + ACL</li><li>Comparer VPN et ZTNA</li><li>Interpréter des événements de connexion</li></ul>`+nt("Important","Les consoles sont des illustrations pédagogiques : elles n’exécutent aucune commande. Utilisez Packet Tracer ou un laboratoire autorisé.",1)},
{g:"Séance 4 — Contrôle d’accès",id:"s1",t:"1. Contrôle d’accès",h:`<h2>1. Contrôle d’accès : notions de base</h2><p>Il définit <b>qui</b> accède à <b>quelle ressource</b>, pour <b>quelles actions</b> et dans <b>quelles conditions</b>.</p><ul><li><b>Identification</b> : annoncer une identité.</li><li><b>Authentification</b> : prouver cette identité.</li><li><b>Autorisation</b> : décider de ce qui est permis.</li></ul>`+tb(["Modèle","Principe","Exemple"],[["DAC","Le propriétaire gère les permissions","Partage d’un dossier"],["MAC","Règles centrales et classification","Système classifié"],["RBAC","Permissions liées à des rôles","Comptable, technicien, admin"],["ABAC","Décision selon attributs et contexte","Rôle, appareil conforme, risque"]])+nt("Exemple","Sophie s’identifie, s’authentifie (mot de passe + MFA), puis l’application vérifie son rôle : elle consulte les factures mais n’administre pas les comptes.")},
{id:"s2",t:"2. MFA",h:`<h2>2. MFA : fonctionnement et facteurs</h2><p>La MFA exige <b>au moins deux facteurs de catégories différentes</b>. Mot de passe + PIN = deux fois la connaissance : ce n’est pas une MFA.</p>`+tb(["Catégorie","Exemples","Risques"],[["Connaissance","Mot de passe, PIN","Hameçonnage, force brute"],["Possession","Téléphone, clé FIDO2, carte à puce","Perte, vol"],["Inhérence","Empreinte, visage","Faux positifs, usurpation"]])+tb(["Méthode","Appréciation"],[["SMS","Mieux que rien ; SIM swapping, interception"],["TOTP","Pratique ; code relayable par un faux site"],["Push","Fatigue MFA ; activer la correspondance de numéro"],["FIDO2 / WebAuthn","Très résistante au phishing classique"],["Certificat / carte à puce","Dépend du stockage de la clé et de la gestion"]])+nt("Attention","Une MFA réduit le risque sans le supprimer : vol de session, terminal compromis et récupération de compte faible restent possibles.",1)},
{id:"s3",t:"3. Certificats",h:`<h2>3. Certificats numériques</h2><p>Un certificat X.509 associe une <b>identité</b> à une <b>clé publique</b>, signé par une autorité de certification. La clé privée reste protégée.</p><p>En TLS, le client vérifie le nom du serveur, la validité, la chaîne de confiance et les usages. Le cadenas indique une connexion sécurisée vers le domaine, pas l’honnêteté du site.</p>`+tb(["Certificat serveur","Certificat client"],[["Le client vérifie l’identité du serveur (HTTPS).","Le serveur authentifie un utilisateur ou un équipement (mTLS)."]])+nt("Attention","Ne jamais contourner automatiquement un avertissement : vérifier nom, date, chaîne et renouvellement.",1)},
{id:"s4",t:"4. Droits et moindre privilège",h:`<h2>4. Gestion des droits et moindre privilège</h2><p>Donner uniquement les droits nécessaires à la mission, pour la durée nécessaire.</p>`+tb(["Ressource","Comptable","Commercial","Technicien","Admin"],[["Factures","Lecture/écriture","Aucun ou lecture","Aucun par défaut","Selon mission"],["CRM","Lecture limitée","Lecture/écriture","Aucun par défaut","Selon mission"],["Logs","Aucun","Aucun","Selon mission","Contrôlé"],["Config serveur","Aucun","Aucun","Limité","Contrôlé"]])+`<ul><li>Comptes nominatifs, pas de comptes partagés</li><li>Désactivation rapide au départ</li><li>Revue des droits périodique</li><li>Comptes admin séparés des comptes quotidiens</li><li>Élévation temporaire et traçabilité</li></ul>`+nt("À retenir","La séparation des tâches complète le moindre privilège : l’un prépare un virement, l’autre le valide.")},
{id:"s5",t:"5. Segmentation",h:`<h2>5. Segmentation réseau</h2><p>Un VLAN sépare logiquement, mais le routage inter-VLAN doit être filtré (ACL ou pare-feu).</p>`+tb(["Zone","Contenu","Politique"],[["VLAN 10 PROD","Postes employés","Applications nécessaires seulement"],["VLAN 20 COMPTA","Serveur comptabilité","Employés autorisés, ports requis"],["VLAN 30 GUEST","Invités","Internet seulement"],["VLAN admin","Postes d’administration","Accès restreint aux interfaces de gestion"]])+nt("Attention","La segmentation limite le déplacement latéral sans supprimer toutes les attaques : revoir les règles et surveiller.",1)},
{id:"s6",t:"6. Déployer la MFA",h:`<h2>6. Déployer la MFA dans une organisation</h2><p>Trois volets : stratégie, choix technologique, conduite du changement, après une analyse de risque.</p>`+tb(["Critère","OTP / Push","Clés FIDO2"],[["Phishing","TOTP relayable ; push : fatigue MFA","Très élevée"],["Coût","Faible, support à prévoir","Clés + secours + logistique"],["Profils","Collaborateurs, nomades","Admins, direction, comptes à risque"]])+`<h3>Plan technique</h3><ol><li><b>Cartographier et cibler</b> : inventaire, pilote, comptes à privilèges d’abord.</li><li><b>Autoriser les méthodes</b> dans l’IdP ; privilégier les méthodes résistantes au phishing.</li><li><b>Accès conditionnel</b> : critique, rôle privilégié, terminal non conforme, risque.</li><li><b>Enrôlement et récupération</b> aussi protégés que la connexion.</li></ol><h3>Calendrier</h3><p>Préparation → Pilote → Comptes sensibles → Généralisation par vagues → Amélioration continue. Mesurer : taux d’enrôlement, incidents de support, comptes non protégés.</p>`},
{id:"s7",t:"7. DSP2 / SCA",h:`<h2>7. DSP2 et authentification forte (SCA)</h2><p>L’article 97 impose la SCA pour l’accès en ligne au compte, le paiement électronique et les actions à risque. Pour un paiement à distance : <b>lien dynamique</b> avec montant et bénéficiaire. Deux éléments de catégories différentes et indépendants.</p>`+tb(["Cas","À retenir"],[["Accès au compte","SCA par défaut ; exemptions sous conditions (AISP : jusqu’à 180 jours, pas pour tous les parcours)"],["Faible montant","≤ 30 € ; cumul ≤ 100 € ou moins de six opérations consécutives"],["Récurrents","SCA à la création/modification de la série"],["Bénéficiaire de confiance","Exemption selon règles et procédure"],["TRA","Selon taux de fraude ; le seuil de 500 € n’est pas universel"],["Décision","Le prestataire peut refuser une exemption"]])+nt("Attention","Les exemptions ne sont pas des droits automatiques (règlement délégué (UE) 2018/389).",1)+`<p><b>Open Banking</b> : accès avec consentement via des prestataires agréés : AISP (informations de compte) et PISP (initiation de paiement).</p>`},
{g:"Séance 5 — Accès distants",id:"s8",t:"8. VPN, ZTNA, Zero Trust",h:`<h2>8. Accès distants : VPN, ZTNA et Zero Trust</h2>`+tb(["VPN","ZTNA"],[["Tunnel protégé vers une passerelle ou un réseau","Accès à des applications précises après vérification d’identité (et d’appareil)"],["Peut ouvrir un sous-réseau entier","Évite l’exposition générale du réseau"],["Utile si les flux sont restreints","Complète ou remplace certains VPN"]])+nt("À retenir","Le Zero Trust n’est pas un produit : vérification explicite, moindre privilège, surveillance continue. Un VPN peut en faire partie, sans l’être à lui seul.")+nt("Exemple","Une comptable à domicile : identité, MFA, ordinateur géré et à jour, accès à l’application financière seulement.")},
{id:"s9",t:"9. Logs et indicateurs",h:`<h2>9. Logs, détection des anomalies et indicateurs</h2>`+con("Poste d’analyste SOC",[["analyste@soc:~$ ","grep -c \"result=failure\" auth.log"],"3",["analyste@soc:~$ ","grep \"result=failure\" auth.log | cut -d' ' -f3 | sort | uniq -c"],"      3 src=198.51.100.24"],"l")+`<p>Trois échecs suivis d’une réussite sont suspects, mais ne prouvent pas une attaque : vérifier source, MFA, habitudes et actions après connexion.</p><h3>Signaux</h3><ul><li>Échecs répétés puis réussite ; sources inhabituelles</li><li>Demandes MFA répétées ou refusées</li><li>Nouveau rôle privilégié ou compte admin</li><li>Suppression de journaux, désactivation de protections</li></ul>`+tb(["Indicateur","Calcul"],[["Couverture MFA","Comptes protégés ÷ comptes concernés × 100 (ex. 180/200 = 90 %)"],["Comptes à privilèges","Nombre actif, justification, propriétaire"],["Délai de désactivation","Départ → désactivation effective"],["Temps de traitement","Détection → prise en charge"]])},
{g:"TP SecureCorp",id:"tp1",t:"Partie 1 — VLAN et ACL",h:`<h2>TP — Partie 1 : segmentation (≈ 60 min)</h2><p>R1, S1, 2 PC employés, 1 PC invité, 1 serveur compta.</p>`+tb(["VLAN","Sous-réseau","Passerelle","Équipements"],[["10 PROD","192.168.10.0/24","192.168.10.1","PC 1 (.11) et 2 (.12)"],["20 COMPTA","192.168.20.0/24","192.168.20.1","Serveur (.10)"],["30 GUEST","192.168.30.0/24","192.168.30.1","PC invité (.20)"]])+`<h3>A — Constater le réseau plat</h3><p>Dans un sous-réseau unique, l’invité joint le serveur : trop permissif.</p><h3>B — Créer les VLAN</h3>`+con("Switch S1 · Cisco IOS",[["Switch> ","enable"],["Switch# ","configure terminal"],["Switch(config)# ","hostname S1"],["S1(config)# ","vlan 10"],["S1(config-vlan)# ","name PROD"],["S1(config-vlan)# ","vlan 20"],["S1(config-vlan)# ","name COMPTA"],["S1(config-vlan)# ","vlan 30"],["S1(config-vlan)# ","name GUEST"],["S1(config-vlan)# ","end"],[S1,"show vlan brief"],"+10   PROD     active","+20   COMPTA   active","+30   GUEST    active"])+`<h3>C — Ports et trunk</h3>`+con("Switch S1 · Cisco IOS",[["S1(config)# ","interface range fastEthernet 0/1-2"],["S1(config-if-range)# ","switchport mode access"],["S1(config-if-range)# ","switchport access vlan 10"],["S1(config)# ","interface fastEthernet 0/3"],["S1(config-if)# ","switchport access vlan 20"],["S1(config)# ","interface fastEthernet 0/4"],["S1(config-if)# ","switchport access vlan 30"],["S1(config)# ","interface gigabitEthernet 0/1"],["S1(config-if)# ","switchport mode trunk"],[S1,"show interfaces trunk"],"+Gig0/1   on   802.1q   trunking   1"])+`<p><code>access</code> : un seul VLAN pour un terminal ; <code>trunk</code> : plusieurs VLAN marqués 802.1Q vers le routeur.</p><h3>D — Routage inter-VLAN (router-on-a-stick)</h3>`+con("Routeur R1 · Cisco IOS",[["Router(config)# ","hostname R1"],["R1(config)# ","interface gigabitEthernet 0/0"],["R1(config-if)# ","no shutdown"],["R1(config)# ","interface gigabitEthernet 0/0.10"],["R1(config-subif)# ","encapsulation dot1Q 10"],["R1(config-subif)# ","ip address 192.168.10.1 255.255.255.0"],"… idem .20 et .30",[R1,"show ip interface brief"],"+GigabitEthernet0/0.10  192.168.10.1  up  up"],"r")+nt("Erreur fréquente","Saisir l’adresse IP avant <code>encapsulation dot1Q</code> est refusé : encapsulation d’abord.",1)+`<h3>E — Adresses des terminaux</h3><p>Desktop &gt; IP Configuration : IP, masque 255.255.255.0 et passerelle .1 du VLAN.</p><h3>F — ACL</h3>`+con("Routeur R1 · Cisco IOS",[["R1(config)# ","ip access-list extended GUEST-IN"],["R1(config-ext-nacl)# ","deny ip 192.168.30.0 0.0.0.255 192.168.20.0 0.0.0.255"],["R1(config-ext-nacl)# ","permit ip 192.168.30.0 0.0.0.255 any"],["R1(config)# ","interface gigabitEthernet 0/0.30"],["R1(config-subif)# ","ip access-group GUEST-IN in"]],"r")+`<p><code>0.0.0.255</code> est un masque générique. Les règles sont lues dans l’ordre ; <code>in</code> filtre le trafic dès son arrivée du VLAN invité. Il existe un <i>deny</i> implicite final.</p>`+nt("Attention","Cette ACL laisse l’invité joindre le VLAN 10. Insérer avant le permit : <code>5 deny ip 192.168.30.0 0.0.0.255 192.168.10.0 0.0.0.255</code> (numéro de séquence). Ne pas copier en production.",1)+`<h3>G — Vérifier</h3>`+tb(["Test","Attendu"],[["Employé → passerelle / serveur compta","Réussite"],["Invité → passerelle VLAN 30","Réussite"],["Invité → serveur compta","Échec"],["show access-lists","Compteur du deny qui augmente"]])+con("PC Invité · Packet Tracer",[["C:\\> ","ping 192.168.20.10"],"!Reply from 192.168.30.1: Destination host unreachable.","!Packets: Sent = 4, Received = 0, Lost = 4 (100% loss)"])+`<p><b>Dépannage dans l’ordre :</b> adresses et masques → passerelles → interfaces → VLAN des ports → trunk → sous-interfaces → ACL et son sens.</p><p><b>Livrable :</b> topologie, <code>show vlan brief</code>, <code>show interfaces trunk</code>, <code>show ip interface brief</code>, <code>show access-lists</code>, tableau de tests avant/après.</p>`},
{id:"tp2",t:"Partie 2 — MFA TOTP",h:`<h2>TP — Partie 2 : activer et tester la MFA TOTP (≈ 45 min)</h2>`+nt("Important","Compte de démonstration autorisé uniquement. Jamais de compte, mot de passe ou QR code réel. Ne pas consigner code, QR code, secret ni codes de secours dans le rapport.",1)+`<ol><li><b>État initial</b> : mot de passe seul.</li><li><b>Activer la MFA</b> : scanner le QR code (ou clé manuelle), saisir le code de confirmation, conserver les codes de récupération.</li><li><b>Reconnexion</b> en fenêtre privée : second facteur demandé ; code erroné ou expiré refusé.</li><li><b>Perte du second facteur</b> : connexion impossible ; tester la récupération autorisée.</li><li><b>Journaux</b> : tentatives, activation, récupération.</li></ol>`+con("Poste Linux de laboratoire",[["etudiant@lab:~$ ","echo $(( $(date +%s) / 30 ))"],"59733334  (fenêtre de 30 s)",["etudiant@lab:~$ ","oathtool --totp -b \"&lt;SECRET_DE_TEST&gt;\""],"482913  (valeur d’exemple)"],"l")+`<p>Le TOTP (RFC 6238) dérive le code du <b>secret partagé</b> et du <b>temps</b>, par fenêtres de 30 s. Une horloge décalée fait refuser les codes.</p>`+con("Serveur d’authentification de test",[["admin-lab$ ","grep mfa_verify audit.log"],"!… event=mfa_verify result=failure reason=invalid_code","+… event=mfa_verify result=success"])+tb(["Test","Attendu"],[["Mot de passe seul","Refus / second facteur demandé"],["Mot de passe + TOTP valide","Connexion"],["Code erroné ou expiré","Refus"],["Récupération","Selon la procédure autorisée"]])+`<p><b>Livrable :</b> capture sans secret, tableau de tests, analyse de ce que la MFA bloque et des risques restants.</p>`},
{g:"Révision et ressources",id:"s11",t:"11. Questions de synthèse",h:`<h2>11. Questions de synthèse</h2>`+[["Pourquoi deux mots de passe ne sont-ils pas une MFA ?","Même catégorie (connaissance)."],["Un VLAN bloque-t-il tout vers un autre VLAN ?","Non : routage inter-VLAN et filtrage décident."],["Un VPN donne-t-il accès à tout le réseau ?","Non : routes, ACL, pare-feu et politiques limitent."],["Pourquoi FIDO2 pour les admins ?","Résistance au phishing grâce à la liaison au domaine."],["Échecs puis réussite : que faire ?","Qualifier : source, MFA, actions ; préserver les journaux ; incident si besoin."],["Une exemption DSP2 dispense-t-elle toujours de SCA ?","Non : conditionnelle, refusable par le prestataire."],["Pourquoi l’ACL en entrée de la sous-interface invité ?","Filtrer dès l’arrivée, avant le routage."],["Quelle faiblesse dans GUEST-IN ?","Le permit ip … any laisse l’invité joindre le VLAN 10."]].map(q=>'<details><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>').join("")},
{id:"s12",t:"12. Lexique",h:`<h2>12. Lexique</h2>`+tb(["Terme","Définition"],[["ACL","Liste de contrôle d’accès réseau"],["ABAC / DAC / MAC / RBAC","Contrôle d’accès par attributs / discrétionnaire / obligatoire / par rôles"],["AISP / PISP","Prestataire d’information sur les comptes / d’initiation de paiement"],["FIDO2/WebAuthn","Authentification résistante au phishing"],["IdP","Fournisseur d’identité"],["MFA","Authentification multifacteur"],["mTLS","TLS avec authentification mutuelle"],["Router-on-a-stick","Routage inter-VLAN via un trunk et des sous-interfaces"],["SCA","Authentification forte du client (DSP2)"],["SIEM","Centralisation et corrélation des événements"],["TOTP","Code temporaire fondé sur le temps"],["Trunk","Lien transportant plusieurs VLAN (802.1Q)"],["VLAN / VPN","Réseau local virtuel / réseau privé virtuel"],["ZTNA","Accès Zero Trust à des ressources précises"]])},
{id:"s13",t:"13. Références",h:`<h2>13. Références utiles</h2><ul><li><a href="https://messervices.cyber.gouv.fr/guides/recommandations-relatives-lauthentification-multifacteur-et-aux-mots-de-passe" target="_blank" rel="noopener">ANSSI — Recommandations MFA et mots de passe</a></li><li><a href="https://messervices.cyber.gouv.fr/documents-guides/anssi-guide-authentification_multifacteur_et_mots_de_passe.pdf" target="_blank" rel="noopener">ANSSI — Guide PDF</a></li><li><a href="https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:32015L2366" target="_blank" rel="noopener">Directive (UE) 2015/2366 (DSP2), art. 97</a></li><li><a href="https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:32018R0389" target="_blank" rel="noopener">Règlement délégué (UE) 2018/389</a></li></ul>`+nt("Note","Textes, exemptions et interfaces évoluent : consulter les sources à jour.")},
{id:"ann",t:"Annexes",h:`<h2>Annexes</h2><h3>A — Aide-mémoire Cisco IOS</h3>`+tb(["Commande","Usage"],[["<code>show vlan brief</code>","VLAN et ports"],["<code>show interfaces trunk</code>","Trunks et VLAN autorisés"],["<code>show ip interface brief</code>","État et IP des interfaces"],["<code>show access-lists</code>","Règles ACL et compteurs"],["<code>show ip interface g0/0.30</code>","ACL appliquée"]])+`<h3>B — Barème indicatif (20 pts)</h3>`+tb(["Partie","Critère","Pts"],[["1","VLAN et ports","3"],["1","Trunk et sous-interfaces","3"],["1","ACL correcte et expliquée","3"],["1","Tests avant/après interprétés","3"],["2","MFA activée sans secret exposé","3"],["2","Tableau de tests complet","3"],["2","Analyse des limites","2"]])},
{id:"amel",t:"Pistes d’amélioration",h:`<h2>Pistes d’amélioration du cours</h2><ol><li><b>Durcir l’ACL GUEST-IN</b> : bloquer aussi le VLAN 10 et ne permettre que Internet, DNS et DHCP.</li><li><b>Ajouter un VLAN d’administration</b> (ex. VLAN 99) en exercice d’approfondissement.</li><li><b>Sécuriser le switch</b> : ports inutilisés désactivés, <code>switchport trunk allowed vlan 10,20,30</code>, VLAN natif dédié.</li><li><b>Vraies captures Packet Tracer</b> et fichier <code>.pkt</code> de départ à distribuer.</li><li><b>Démonstration encadrée</b> du relais de code TOTP, pour justifier FIDO2.</li><li><b>Quiz</b> de 10 questions en fin de séance et corrigé enseignant séparé.</li><li><b>Références</b> : NIST SP 800-207 (Zero Trust), guides ANSSI sur la segmentation.</li><li><b>Date de révision</b> : DSP2 et ses exemptions évoluent.</li></ol>`}
];

const a=document.createElement("a");a.href="#"+s.id;a.textContent=s.t;a.dataset.i=i;gd.appendChild(a)});
